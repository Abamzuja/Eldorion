<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Eldorion · Atlas interativo</title>
    <meta
      name="description"
      content="Explore as cidades e regiões de Eldorion. Um atlas interativo para aventureiros."
    />
    <link rel="icon" href="./assets/icons/favicon.svg" />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="stylesheet" href="./assets/css/atlas.css" />
    <link rel="stylesheet" href="./assets/css/quests.css" />
  </head>
  <body>
    <div id="loader" hidden role="status" aria-live="polite">
      <div class="compass" aria-hidden="true">✦</div>
      <strong>Eldorion</strong>
      <p id="load-message">Preparando o mapa…</p>
      <button id="retry" hidden>Tentar novamente</button>
    </div>
    <noscript
      ><p class="no-script">
        Ta faltando um JavaScript nessa porra, se vira pra consertar
      </p></noscript
    >
    <header>
      <button
        id="menu-toggle"
        type="button"
        aria-controls="atlas-sidebar"
        aria-expanded="true"
        aria-label="Recolher menu"
      >
        ☰
      </button>
      <h1>Eldorion <span>Atlas do mundo</span></h1>
      <p id="header-hint">Arraste para explorar · Selecione um local</p>
      <button id="quest-toggle" type="button" aria-controls="quest-sidebar" aria-expanded="true" aria-label="Recolher missões" title="Missões">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 3h12v15a3 3 0 0 0 3 3H8a3 3 0 0 1-3-3V3Z"/><path d="M17 15h5v3a3 3 0 0 1-5 0M8 7h6M8 11h6"/></svg>
      </button>
    </header>
    <aside id="quest-sidebar" aria-labelledby="quest-title">
      <button id="quest-rail" type="button" hidden aria-label="Expandir missões" aria-controls="quest-content"><span aria-hidden="true">◇</span><small>Missões</small><span id="quest-count">0</span></button>
      <div id="quest-content">
        <div class="quest-heading"><div><p class="eyebrow">Diário da campanha</p><h2 id="quest-title">Missões</h2></div><button id="quest-collapse" type="button" aria-label="Recolher missões">›</button></div>
        <p id="quest-total"></p>
        <div class="quest-filters" role="group" aria-label="Filtrar missões"><button type="button" data-quest-filter="ativa" aria-pressed="true">Em andamento</button><button type="button" data-quest-filter="concluida" aria-pressed="false">Concluídas</button></div>
        <button id="quest-full-page" type="button">Abrir diário completo ↗</button>
        <div id="quest-list"></div>
      </div>
    </aside>
    <button id="quest-backdrop" type="button" hidden tabindex="-1" aria-label="Fechar missões"></button>
    <aside id="atlas-sidebar" aria-label="Navegação do atlas">
      <div class="sidebar-heading">
        <span aria-hidden="true">✦</span
        ><span class="nav-label">Explore Eldorion</span>
      </div>
      <nav aria-label="Seções do atlas">
        <button
          data-section="mapa"
          aria-label="Mapa"
          aria-current="page"
          title="Mapa"
        >
          <span class="nav-icon" aria-hidden="true">◈</span
          ><span class="nav-label">Mapa</span>
        </button>
        <button data-section="missoes" title="Missões" aria-label="Missões"><span class="nav-icon" aria-hidden="true">◇</span><span class="nav-label">Missões</span></button>
        <button data-section="historia" title="História" aria-label="História">
          <span class="nav-icon" aria-hidden="true">◷</span
          ><span class="nav-label">História</span>
        </button>
        <button
          data-section="guildas"
          title="Guildas e facções"
          aria-label="Guildas e facções"
        >
          <span class="nav-icon" aria-hidden="true">⚑</span
          ><span class="nav-label">Guildas e Facções</span>
        </button>
        <button
          data-section="pessoas"
          title="Pessoas importantes"
          aria-label="Pessoas importantes"
        >
          <span class="nav-icon" aria-hidden="true">♙</span
          ><span class="nav-label">Pessoas importantes</span>
        </button>
        <button data-section="locais" title="Locais" aria-label="Locais">
          <span class="nav-icon" aria-hidden="true">⌖</span
          ><span class="nav-label">Locais</span>
        </button>
      </nav>
      <p class="sidebar-footer nav-label">
        Um mundo de histórias<br />para descobrir.
      </p>
    </aside>
    <button
      id="menu-backdrop"
      hidden
      tabindex="-1"
      aria-label="Fechar menu"
    ></button>
    <section id="atlas-content" hidden aria-labelledby="section-title">
      <div class="atlas-page">
        <p class="eyebrow">Atlas de Eldorion</p>
        <h2 id="section-title" tabindex="-1"></h2>
        <p id="section-intro"></p>
        <div id="section-body"></div>
      </div>
    </section>
    <main
      id="viewport"
      tabindex="0"
      aria-label="Mapa interativo de Eldorion. Use as setas para mover e mais ou menos para ampliar."
    >
      <div id="map">
        <img
          class="world"
          src="./assets/images/maps/eldorion-original.png"
          width="3344"
          height="1882"
          alt="Mapa de Eldorion: Verdantia a noroeste, Aniloria a nordeste, Serpenat ao sul e ilhas entre os continentes"
          draggable="false"
        />
        <div id="markers"></div>
      </div>
    </main>
    <nav class="controls" aria-label="Controles do mapa">
      <button id="out" aria-label="Diminuir zoom">−</button
      ><button id="fit">Mapa inteiro</button
      ><button id="in" aria-label="Aumentar zoom">+</button>
    </nav>
    <section id="detail" hidden role="region" aria-labelledby="place-title">
      <button class="close" type="button" aria-label="Fechar detalhes">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
          focusable="false">
          <path d="M6 6L18 18M18 6L6 18" />
        </svg>
      </button>
      <div id="gallery"></div>
      <article>
        <p id="place-region" class="eyebrow"></p>
        <h2 id="place-title"></h2>
        <p id="place-description"></p>
        <div id="thumbs"></div>
      </article>
    </section>
    <script src="./assets/js/data/locations.js"></script>
    <script src="./assets/js/app.js"></script>
    <script src="./assets/js/history.js"></script>
    <script src="./assets/js/atlas.js"></script>
    <script src="./assets/js/data/quests.js"></script>
    <script src="./assets/js/quests.js"></script>
  </body>
</html>
